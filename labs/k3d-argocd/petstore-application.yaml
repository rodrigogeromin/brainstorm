apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swagger-petstore
  namespace: argocd
spec:
  project: appset
  source:
    repoURL: https://bedag.github.io/helm-charts
    chart: raw
    targetRevision: 2.0.2
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        templates:
          - |
            apiVersion: v1
            kind: Namespace
            metadata:
              name: petstore
          - |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: swagger-petstore
              namespace: petstore
              labels:
                app.kubernetes.io/name: swagger-petstore
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: swagger-petstore
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: swagger-petstore
                spec:
                  containers:
                    - name: petstore
                      image: swaggerapi/petstore3:1.0.28
                      imagePullPolicy: IfNotPresent
                      ports:
                        - name: http
                          containerPort: 8080
                          protocol: TCP
                      resources:
                        requests:
                          cpu: 100m
                          memory: 256Mi
                        limits:
                          cpu: 500m
                          memory: 768Mi
                      startupProbe:
                        httpGet:
                          path: /api/v3/openapi.json
                          port: http
                        periodSeconds: 5
                        failureThreshold: 36
                      readinessProbe:
                        httpGet:
                          path: /api/v3/openapi.json
                          port: http
                        periodSeconds: 10
                        failureThreshold: 3
                      livenessProbe:
                        httpGet:
                          path: /api/v3/openapi.json
                          port: http
                        initialDelaySeconds: 10
                        periodSeconds: 20
                        failureThreshold: 3
          - |
            apiVersion: v1
            kind: Service
            metadata:
              name: swagger-petstore
              namespace: petstore
              labels:
                platform.io/swagger.enabled: "true"
              annotations:
                platform.io/swagger.path: /api/v3/openapi.json
                platform.io/swagger.port: "8080"
                platform.io/swagger.title: Swagger Petstore (OpenAPI 3.0)
            spec:
              selector:
                app.kubernetes.io/name: swagger-petstore
              ports:
                - name: http
                  port: 8080
                  targetPort: http
                  protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: petstore
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
