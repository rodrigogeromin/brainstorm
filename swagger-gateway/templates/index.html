<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API documentation — __PUBLICATION_ID__</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; background: #fafafa; } #notice { padding: 12px; font: 14px system-ui; }</style>
</head>
<body>
  <div id="notice">API calls are sent through the authenticated Argo CD gateway to this discovered Service. Write operations can change data.</div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    const gatewayOrigin = parent.location.origin;
    const specUrl = `${gatewayOrigin}/extensions/swagger/specs/__PUBLICATION_ID__`;
    SwaggerUIBundle({
      url: specUrl,
      dom_id: '#swagger-ui',
      supportedSubmitMethods: ['get', 'post', 'put', 'patch', 'delete', 'options', 'head'],
      tryItOutEnabled: true,
      validatorUrl: null,
      withCredentials: true,
      requestInterceptor: request => {
        const target = new URL(request.url, gatewayOrigin);
        if (target.pathname === '/extensions/swagger/specs/__PUBLICATION_ID__') {
          request.url = specUrl;
        } else {
          request.url = `${gatewayOrigin}/extensions/swagger/proxy/__PUBLICATION_ID__${target.pathname}${target.search}`;
        }
        request.credentials = 'same-origin';
        request.headers['Argocd-Application-Name'] = 'argocd:swagger-gateway';
        request.headers['Argocd-Project-Name'] = 'appset';
        return request;
      }
    });
  </script>
</body>
</html>
