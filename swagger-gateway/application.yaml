                volumes:
                - name: source
                  configMap:
                    name: swagger-java-source
        - |
          apiVersion: v1
          kind: Service
          metadata:
            name: swagger-go
            namespace: swagger-gateway
            labels:
              platform.io/swagger.enabled: 'true'
            annotations:
              platform.io/swagger.path: /swagger/doc.json
              platform.io/swagger.port: '8080'
              platform.io/swagger.title: Go demo (demonstration)
          spec:
            selector:
              app: swagger-go
            ports:
            - name: http
              port: 8080
              targetPort: http
        - |
          apiVersion: v1
          kind: Service
          metadata:
            name: swagger-java
            namespace: swagger-gateway
            labels:
              platform.io/swagger.enabled: 'true'
            annotations:
              platform.io/swagger.path: /v3/api-docs
              platform.io/swagger.port: '8080'
              platform.io/swagger.title: Java demo (demonstration)
          spec:
            selector:
              app: swagger-java
