            - name: http
              port: 8080
              targetPort: http
        - |
          apiVersion: v1
          kind: Service
          metadata:
            name: swagger-gateway
            namespace: swagger-gateway
            labels:
              platform.io/swagger.enabled: 'true'
            annotations:
              platform.io/swagger.path: /openapi.json
              platform.io/swagger.port: '8080'
              platform.io/swagger.title: Swagger Gateway API
          spec:
            selector:
              app: swagger-gateway
            ports:
            - name: http
              port: 8080
              targetPort: http
        - |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: swagger-gateway-from-argocd
            namespace: swagger-gateway
          spec:
            podSelector:
              matchLabels:
                app: swagger-gateway
            policyTypes:
            - Ingress
            ingress:
            - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: argocd
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-server
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: swagger-gateway
                podSelector:
                  matchLabels:
                    app: swagger-gateway
              ports:
              - protocol: TCP
                port: 8080
  destination:
    server: https://kubernetes.default.svc
    namespace: swagger-gateway
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
